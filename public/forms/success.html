<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inquiry received</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify redirects here after a successful form submission. Visitors never
      see it: the contact page submits with fetch and shows its own confirmation.
      Its only job is to be a page that is unmistakably NOT the app shell, so the
      client can verify the submission really reached Netlify Forms.
    -->
    <p data-inquiry-received="true">Inquiry received.</p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inquiry received</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify returns this page's contents after a successful form submission.
      Visitors never see it: the contact page submits with fetch and renders its
      own confirmation.

      The data-inquiry-received attribute below is load-bearing. It is how
      src/api/inquirySubmit.js distinguishes a real success from the
      single-page-app shell being returned by a rewrite rule. Do not remove it.
    -->
    <p data-inquiry-received="true">Inquiry received.</p>
  </body>
</html>

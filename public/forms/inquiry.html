<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inquiry form endpoint</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      This file exists so Netlify can discover the consultation form.

      Netlify detects forms by parsing deployed HTML at BUILD time. The real
      form is rendered by React in src/pages/Contact.jsx, so it appears in no
      static file and would never be detected. Declaring the fields here fixes
      that.

      The action matters: on a successful submission Netlify redirects to it.
      success.html is a plain static page with no React root element, which is
      how src/api/inquirySubmit.js tells a genuine success apart from the
      single-page-app shell being returned by a redirect rule.

      Field names must stay in sync with src/api/inquirySubmit.js.
    -->
    <form name="inquiry" action="/forms/success.html" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="parentName" />
      <input type="email" name="email" />
      <input type="text" name="grade" />
      <input type="text" name="subject" />
      <input type="text" name="interestedProgram" />
      <input type="text" name="goal" />
      <textarea name="details"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>

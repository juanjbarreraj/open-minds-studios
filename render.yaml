# Render blueprint for the Open Minds Studios API.
#
# SQLite needs a filesystem that survives restarts, which rules out serverless
# hosting. This declares a persistent disk and points the database, uploads,
# backups and exports at it, so a deploy never wipes student or tutor records.
services:
  - type: web
    name: openminds-api
    runtime: node
    # PERMANENT once the service is created — Render cannot change a
    # service's region afterwards, only recreate it elsewhere. The studio
    # and its families are in Pittsburgh (ET), so US East keeps every
    # dashboard round trip near ~20ms instead of ~75ms from Oregon,
    # which is the default when this is omitted.
    region: virginia
    # Not the free plan: free instances sleep when idle, and a 30-second cold
    # start on the login page is not acceptable for a real portal.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: openminds-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Generated by Render, never committed. The server refuses to start in
      # production if this is missing or left as a placeholder.
      - key: SESSION_SECRET
        generateValue: true
      # The frontend is on a different host, so every API call is cross-site.
      - key: CORS_ORIGIN
        value: https://openmindsstudios.com,https://www.openmindsstudios.com
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_DOMAIN
        value: .openmindsstudios.com
      - key: DATABASE_PATH
        value: /var/data/openminds.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: EXPORT_DIR
        value: /var/data/exports
